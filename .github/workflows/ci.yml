name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: windows-amd64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go run -ldflags '-X main.version=v0.0.0-ci' ./cmd/idlemesh version
        env:
          CGO_ENABLED: '0'
      - if: matrix.target == 'linux-amd64'
        run: go test -race ./...
      - if: matrix.target == 'linux-amd64'
        run: go vet ./...
